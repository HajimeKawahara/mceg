equations:
- id: continuity
  revision: '1'
  latex: \rho = \frac{\dot M}{4\pi r^2 v}
  description: Steady spherical mass continuity.
  scope: Positive radius and outward speed; prescribed mass-loss rate.
  assumptions:
  - No sources or sinks of mass between shells.
  symbols:
    rho:
      latex: \rho
      description: Mass density
      unit: g cm^-3
    r:
      latex: r
      description: Radius
      unit: cm
    v:
      latex: v
      description: Radial speed
      unit: cm s^-1
    mdot:
      latex: \dot M
      description: Mass-loss rate
      unit: g s^-1
  evidence:
  - definition
bindings:
- id: continuity_density
  equation:
    id: continuity
    revision: '1'
  subject: example_source
  source: examples/equations/provider.py
  symbol: density
  arguments:
    radius_cm:
      symbol: r
    velocity_kms:
      symbol: v
      scale: 100000.0
    mass_loss_g_s:
      symbol: mdot
  result: rho
  note: The return value already uses the equation's density units.
