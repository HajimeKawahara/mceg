  - mceg/README.md
  - mceg/models.yaml
  - src/mceg/validator.py
  - The selected test definitions and saved receipt.
  completion: A maintainer records the boundary/link review and a FollowUpResolution with
    review evidence; only then clear the inventory review_pending flag.
