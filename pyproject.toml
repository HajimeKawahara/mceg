[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mceg"
version = "0.2.0rc2"
description = "Experimental scientific model contracts and evidence links"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["pydantic>=2,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8"]
docs = ["sphinx>=7,<10", "myst-parser>=4,<6"]

[project.scripts]
mceg = "mceg.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mceg = ["data/curated_gas/*.json", "_static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
