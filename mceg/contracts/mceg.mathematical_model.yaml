quantities:
- id: catalog
  revision: '1'
  latex: D
  description: Validated contract record catalog, with explicit IDs and revisions.
  unit: '1'
  domain: Finite validated software records and their serialized representations.
- id: model_id
  revision: '1'
  latex: m
  description: Identifier selecting one mathematical model within this contract.
  unit: '1'
  domain: Finite validated software records and their serialized representations.
- id: revision
  revision: '1'
  latex: v
  description: Exact selected mathematical model revision.
  unit: '1'
  domain: Finite validated software records and their serialized representations.
- id: graph
  revision: '1'
  latex: G
  description: Undirected quantity-relation incidence graph, with declared local symbols.
  unit: '1'
  domain: Finite validated software records and their serialized representations.
- id: closure
  revision: '1'
  latex: \mathcal C
  description: Selected model, quantity definitions and adopted Equation definitions.
  unit: '1'
  domain: Finite validated software records and their serialized representations.
- id: digest
  revision: '1'
  latex: h
  description: Hexadecimal SHA-256 of the canonical JSON definition snapshot.
  unit: '1'
  domain: Finite validated software records and their serialized representations.
equations:
- id: incidence
  revision: '1'
  latex: G=\operatorname{Incidence}(D,m,v),\qquad E_G=\{(r,s,b_r(s)):r\in R_{m,v},\ s\in S_r\}
  description: Connect each adopted relation instance to the quantity named by each declared symbol mapping.
  scope: The selected model supplies relation instances R, declared local symbols S and mappings b. Vertices
    retain distinct quantity aliases and relation instances; edges are undirected incidence.
  symbols:
    catalog:
      latex: D
      description: Validated contract record catalog, with explicit IDs and revisions.
      unit: '1'
    model_id:
      latex: m
      description: Identifier selecting one mathematical model within this contract.
      unit: '1'
    revision:
      latex: v
      description: Exact selected mathematical model revision.
      unit: '1'
    graph:
      latex: G
      description: Undirected quantity-relation incidence graph, with declared local symbols.
      unit: '1'
  assumptions:
  - The contract already passed schema validation; no provider code is imported.
  - Bound indices r and s range over recorded relation instances and symbols.
  evidence:
  - formulation
- id: definition_closure
  revision: '1'
  latex: \mathcal C=\operatorname{Closure}(D,m,v)
  description: Collect the selected model, referenced quantity definitions and adopted Equation definitions.
  scope: Quantity coordinate references are followed recursively. Unrelated definitions and the contents of
    referenced Evidence are outside this definition digest.
  symbols:
    catalog:
      latex: D
      description: Validated contract record catalog, with explicit IDs and revisions.
      unit: '1'
    model_id:
      latex: m
      description: Identifier selecting one mathematical model within this contract.
      unit: '1'
    revision:
      latex: v
      description: Exact selected mathematical model revision.
      unit: '1'
    closure:
      latex: \mathcal C
      description: Selected model, quantity definitions and adopted Equation definitions.
      unit: '1'
  evidence:
  - formulation
- id: snapshot_digest
  revision: '1'
  latex: h=\operatorname{SHA256}(\operatorname{CanonicalJSON}(\mathcal C))
  description: Fingerprint the declared definition closure, including symbol mappings and quantity meanings.
  scope: Sorted record keys and JSON object keys; compact separators, ASCII escaping and finite values. This
    is byte identity of the declaration, not mathematical equivalence or scientific support.
  symbols:
    closure:
      latex: \mathcal C
      description: Selected model, quantity definitions and adopted Equation definitions.
      unit: '1'
    digest:
      latex: h
      description: Hexadecimal SHA-256 of the canonical JSON definition snapshot.
      unit: '1'
  evidence:
  - formulation
mathematical_models:
- id: declared_model_identity
  revision: '1'
  description: Software definition of an explicit incidence graph and its review identity.
  scope: A small self-description of mathematical graph export and snapshot identity; not a physical model
    or package-wide specification.
  quantities:
    catalog:
      quantity:
        id: catalog
        revision: '1'
      role: input
    model_id:
      quantity:
        id: model_id
        revision: '1'
      role: input
    revision:
      quantity:
        id: revision
        revision: '1'
      role: input
    graph:
      quantity:
        id: graph
        revision: '1'
      role: derived
    closure:
      quantity:
        id: closure
        revision: '1'
      role: derived
    digest:
      quantity:
        id: digest
        revision: '1'
      role: derived
  relations:
  - id: incidence
    equation:
      id: incidence
      revision: '1'
    role: Connect each adopted relation instance to the quantity named by each declared symbol mapping.
    quantities:
      catalog: catalog
      model_id: model_id
      revision: revision
      graph: graph
  - id: definition_closure
    equation:
      id: definition_closure
      revision: '1'
    role: Collect the selected model, referenced quantity definitions and adopted Equation definitions.
    quantities:
      catalog: catalog
      model_id: model_id
      revision: revision
      closure: closure
  - id: snapshot_digest
    equation:
      id: snapshot_digest
      revision: '1'
    role: Fingerprint the declared definition closure, including symbol mappings and quantity meanings.
    quantities:
      closure: closure
      digest: digest
bindings:
- id: incidence_export
  equation:
