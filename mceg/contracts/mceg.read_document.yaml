schema_version: '0.2'
model:
  id: mceg.read_document
  name: YAML and JSON document loading
  description: 'One software feature: parse local documents with duplicate-key rejection.
    Schema validation and other MCEG features are outside this pilot.'
  implementation:
    repository: https://github.com/HajimeKawahara/mceg
    revision: 48912543002e02af51d4cc1b19c9e5260508916a
    entry_points:
    - src/mceg/validator.py:read_document
assumptions:
- statement: Execution must remain independent of these optional self-description records.
  evidence:
  - design_intent
- statement: Structural validity and passing software tests must remain separate from scientific
    support.
  evidence:
  - design_intent
- statement: Evidence and remaining review tasks must be inspectable and resumable by humans
    and assistants.
  evidence:
  - design_intent
domains:
- kind: numerical_evaluation
  status: documented
  description: Software input boundary only; no physical quantities or applicability domain.
  conditions:
  - A readable local UTF-8 file is supplied.
  - The .json suffix selects JSON; otherwise JSON-looking text is tried as JSON before falling
    back to YAML on JSON syntax errors.
  - YAML uses a SafeLoader subclass with duplicate-key rejection.
  evidence:
  - implementation
claims:
- id: document_loading_regressions
  revision: '1'
  statement: The selected regression cases reject duplicate JSON keys and six invalid YAML
    inputs (including duplicate keys and a Python object tag), and preserve a JSON exponent
    value.
  kind: numerical_verification
  scope: Seven existing pytest cases named in the receipt. This is software regression verification,
    not exhaustive parser security or scientific validation.
evidence:
- id: design_intent
  kind: theory
  summary: Three authored design commitments for this self-description.
  sources:
  - mceg/README.md
  scope: Normative intent only; the regression assessment does not verify these principles
    across MCEG.
  provenance:
    role: primary
    location: mceg/README.md, Design principles
    inspection: inspected
    note: The principles are authored here; they are not inferred from passing tests.
- id: implementation
  kind: implementation
  summary: 'Inspected read_document and _UniqueKeyLoader: JSON object pairs reject duplicates;
    YAML uses SafeLoader and rejects duplicate or unhashable mapping keys.'
  sources:
  - src/mceg/validator.py
  scope: Document parsing only. load_contract schema dispatch is not assessed.
  subject: recorded_source
  provenance:
    role: primary
    location: src/mceg/validator.py:read_document and _UniqueKeyLoader
    inspection: inspected
    note: This authored source is the primary record of the implemented behavior; no external
      specification compliance is claimed.
- id: regression_run
  kind: numerical_test
  summary: Seven selected existing regression cases passed; command, versions and source hashes
    are retained in the receipt.
  sources:
  - tests/test_validator.py
  - tests/test_v02.py
  - mceg/evidence/read_document/receipt.json
  - mceg/evidence/read_document/pytest.txt
  scope: Six YAML rejection cases through load_contract and one JSON exponent/duplicate-key
    case through read_document. Only the selected cases were executed in this receipt.
  result: passed
  subject: recorded_source
  context: recorded_environment
  artifacts:
  - source: mceg/evidence/read_document/receipt.json
    sha256: 90b71a459888dc20a5b9af02c7fe86d7618e745ba526f584812404fd367b3c99
