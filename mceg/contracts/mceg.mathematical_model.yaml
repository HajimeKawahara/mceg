schema_version: '0.5'
model:
  id: mceg.mathematical_model
  name: Declared mathematical model graphs and identity
  description: Scoped software self-description for quantity connections, incidence graphs and review snapshots;
    MCEG can run without these records.
  implementation:
    repository: https://github.com/HajimeKawahara/mceg
    revision: 48912543002e02af51d4cc1b19c9e5260508916a
    entry_points:
    - src/mceg/mathematical.py:model_graph
    - src/mceg/schema_v05.py:mathematical_model_records
    - src/mceg/schema_v05.py:mathematical_model_digest
assumptions:
- statement: These optional authoring records are not a runtime prerequisite or a self-certification.
  evidence:
  - formulation
- statement: Quantity meaning and domain are authored; unit comparison is exact string comparison without dimensional
    algebra or implicit conversion.
  evidence:
  - formulation
domains:
- kind: numerical_evaluation
  status: documented
  description: Finite software fixtures for schema 0.5 and compatibility with prior schemas.
  conditions:
  - Explicit contract-local IDs and revisions; validated input records.
  - Scope is the recorded regression cases, not all possible input documents.
  evidence:
  - regression_run
claims:
- id: model_graph_regressions
  revision: '1'
  kind: numerical_verification
  statement: The recorded finite tests validate explicit quantity mappings, incidence export and definition
    snapshots, and detect changed model definitions in Assessment, Decision and Use checks while retaining
    the stored support status.
  scope: Finite software tests of explicit semantic quantity references, complete symbol mappings, quantity-relation
    incidence output, deterministic exports, definition snapshots, and Assessment/Decision/Use staleness. No
    solver, dimensional algebra, provider execution, physical adequacy or exhaustive software correctness is
    established. Reading this receipt does not run tests.
  equations:
  - id: incidence
    revision: '1'
  - id: definition_closure
    revision: '1'
  - id: snapshot_digest
    revision: '1'
  mathematical_models:
  - id: declared_model_identity
    revision: '1'
evidence:
- id: formulation
  kind: theory
  summary: Authored software relations and design limits for explicit model assembly.
  sources:
  - docs/en/mathematical_models.md
  - mceg/README.md
  - src/mceg/schema_v05.py
  - src/mceg/mathematical.py
  scope: An inspected declaration of software behavior; not evidence of physical completeness.
  provenance:
    role: primary
    location: Schema 0.5 and mathematical-model export helpers
    inspection: inspected
    note: Inspected explicit ID/revision lookup, symbol mapping, canonical record snapshots and the distinction
      between recorded support and current identity.
- id: regression_run
  kind: numerical_test
  result: passed
  summary: The selected mathematical schema, lifecycle and output tests passed on the pinned source.
  sources:
  - tests/test_mathematical_schema.py
  - tests/test_mathematical_lifecycle.py
  - tests/test_mathematical_output.py
  - mceg/evidence/mathematical_model_20261126/receipt.json
  - mceg/evidence/mathematical_model_20261126/pytest.txt
  scope: Finite software tests of explicit semantic quantity references, complete symbol mappings, quantity-relation
    incidence output, deterministic exports, definition snapshots, and Assessment/Decision/Use staleness. No
    solver, dimensional algebra, provider execution, physical adequacy or exhaustive software correctness is
    established. Reading this receipt does not run tests.
  subject: recorded_source
  context: recorded_environment
  artifacts:
  - source: mceg/evidence/mathematical_model_20261126/receipt.json
    sha256: 8cfa795dfb2fe2b7310b6315ddf5602ffe057f4446401cb20431cd07c4d19791
  - source: mceg/evidence/mathematical_model_20261126/pytest.txt
    sha256: 3d3d7d5f0cf009b1132d0960260b1ae7c8037808382891e84ed93306ecf50380
  provenance:
    role: primary
    location: mceg/evidence/mathematical_model_20261126/receipt.json
    inspection: inspected
    note: Executed the named suites and inspected their assertions and captured output; selected source/test
      bytes matched the frozen commit before and after execution.
- id: symbolic_regression_run_20261126
  kind: numerical_test
  result: passed
  summary: The selected finite regression cases passed on the pinned source.
  sources:
  - tests/test_mathematical_schema.py
  - tests/test_mathematical_lifecycle.py
  - tests/test_mathematical_output.py
  - mceg/evidence/mathematical_model_sympy_20261126/receipt.json
  - mceg/evidence/mathematical_model_sympy_20261126/pytest.txt
  scope: The original finite schema-0.5 model graph, review-lifecycle and export regressions rerun after adding
    optional SymPy sources. No physical completeness or package-wide correctness is established; historical
    judgments remain unchanged.
  subject: symbolic_source_20261126
  context: symbolic_environment_20261126
  artifacts:
  - source: mceg/evidence/mathematical_model_sympy_20261126/receipt.json
    sha256: 0f4a7604fd0e45e4ce6575a9c9990436ed27fdc5b7b85a235a996ee099da83a3
  - source: mceg/evidence/mathematical_model_sympy_20261126/pytest.txt
    sha256: f09f708bdcc3d0c501127fd6d3ba423a9243f047ed3cb0bb0716e0ad6855a0c5
  provenance:
    role: primary
    location: mceg/evidence/mathematical_model_sympy_20261126/receipt.json
    inspection: inspected
    note: Executed the selected cases and inspected their assertions and captured output. Selected source bytes
      match the frozen commit and did not change during execution.
limitations:
- statement: Finite software regressions do not prove mathematical well-posedness, completeness of a physical
    model, equivalence of code to equations, or exhaustive MCEG correctness.
  evidence:
  - formulation
  - regression_run
- statement: The self-description covers selected functions and tests. Selected file hashes are not a complete
    environment lock; independent maintainer review remains pending.
  evidence:
  - regression_run
