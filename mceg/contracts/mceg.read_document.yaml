    sha256: 22dda2ca00ae6324a6f97b96c400ce0c3cb8bf22b31857fc022eeba879e7e569
  provenance:
    role: primary
    location: Selected pytest node IDs in mceg/evidence/read_document/receipt.json; captured
      output in pytest.txt.
    inspection: inspected
    note: 'Executed locally and inspected the selected tests and output: exit 0, seven passed.
      Selected source/test bytes matched the recorded Git revision before and after the run.'
